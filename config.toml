baseURL                          = "https://simply-learn-ai.github.io/"   # Your GitHub Pages URL. Must end with "/"
theme                            = "introduction"
DefaultContentLanguage           = "en"
title                            = "Simply Learn AI"
# disqusshortname                 = ""                     # https://gohugo.io/content-management/comments
# Configure Google Analytics 4 with [services.googleAnalytics] and id = "G-MEASUREMENT_ID".

[params]
    themeStyle                   = "auto"                  # Choose "light" or "dark" or "auto"
    favicon                      = "/img/fav.ico"          # Path to favicon file
    showMenu                     = true                    # Show navigation menu
    showRSSButton                = true                    # Show rss button in navigation
    fadeIn                       = true                    # Turn on/off the fade-in effect
    fadeInIndex                  = false                   # Turn on/off the fade-in effect on the index page even if fade-in was otherwise turned off
    dateFormat                   = "Jan 2, 2006"
    email                        = "hello@example.com"      # E-mail address for contact section
    customCSS                    = ["css/custom.css"]      # Include custom css files placed under assets/
    # customJS                   = ["foo.js"]              # Include custom JavaScript files placed under assets/

    # Configure the home page
    [params.home]
        introHeight              = "fullheight"            # Input either "medium" or "large" or "fullheight"
        showLatest               = true                    # Show latest blog post summary
        showAllPosts             = false                   # Set true to list all posts on home page, or set false to link to separate blog list page
        allPostsArchiveFormat    = true                    # show all posts in an archive format
        numberOfProjectsToShow   = 3                       # Maximum number of projects to show on home page
        localTime                = true                    # Show your current local time in contact section
        timeZone                 = "Australia/Sydney"      # Your timezone (see tz database list)
        timeFormat               = "en-AU"                 # Language specific format to use
    [params.projects]
        useTwoColumns            = false                   # Use a layout with two columns instead of three

    # Share buttons on blog post pages
    [params.share]
        twitter                  = true
        facebook                 = true
        pinterest                = true

    # To enable giscus, the GitHub-discussions-based comment section,
    # input the repository for the discussions below.
    [params.giscus]
        # repo = "github-user/github-repo" # Entering repo will enable giscus
        repo-id = "enter-repo-id"
        category = "Comments"
        category-id = "enter-category-id"
        mapping = "pathname"
        reactions-enabled = "1"
        emit-metadata = "0"
        theme = "light"
        lang = "en"

    # Social icons appear in introduction and contact section.
    [[params.social]]
        url   = "https://github.com/aeo-app"
        icon  = "github" # icon name without the 'fa-'
        icon_pack = "fab"
    [[params.social]]
        url = "mailto:hello@example.com"
        icon = "paper-plane"
        icon_pack = "fas"

# We only use tag as a taxonomies
# You can add more by yourself
[taxonomies]
  tag = "tags"
  series = "series"

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    # noClasses = true
    # For styles, see https://xyproto.github.io/splash/docs/longer/all.html
    style = "solarized-dark"
    tabWidth = 4

[languages]
    [languages.en]
        label     = "English"
        locale     = "en-au"
        contentDir       = "content/en"
        weight           = 0
        title            = "Simply Learn AI"
        [languages.en.params]
            description  = "A practical, safe and surprising introduction to using AI wisely."
            # footerText   = ""                      # Text to override default footer text (markdown allowed)
